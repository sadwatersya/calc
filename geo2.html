<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карта + GPS</title>
<style>
  :root{
    --bg:#16181d; --panel:#23262e; --panel2:#2c303a; --line:#3a3f4b;
    --text:#e9ecf1; --dim:#98a0ae; --accent:#3d8bfd; --warn:#ffb020; --ok:#28c76f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100%}

  #menuToggle{
    position:fixed;top:10px;left:10px;z-index:100;
    width:44px;height:44px;border-radius:12px;
    background:rgba(35,38,46,.92);border:1px solid var(--line);
    color:var(--text);font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.45);
    transition:.2s;
  }
  #menuToggle:active{transform:scale(.94)}

  #btnAddPoi{
    position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:100;
    height:44px;padding:0 14px;border-radius:12px;
    background:rgba(35,38,46,.92);border:1px solid var(--line);
    color:var(--text);font-size:13px;font-weight:bold;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.45);
    transition:.2s;
  }
  #btnAddPoi:active{transform:translateX(-50%) scale(.94)}
  #btnAddPoi.active{background:var(--accent);border-color:var(--accent);}

  #btnPoiToggle{
    position:fixed;top:10px;right:10px;z-index:100;
    width:44px;height:44px;border-radius:12px;
    background:rgba(35,38,46,.92);border:1px solid var(--line);
    color:var(--text);font-size:14px;font-weight:bold;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.45);
    transition:.2s;
  }
  #btnPoiToggle:active{transform:scale(.94)}

  #menuOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;
    opacity:0;pointer-events:none;transition:opacity .22s;
  }
  #menuOverlay.open{opacity:1;pointer-events:auto}

  #toolbar{
    position:fixed;top:0;left:0;bottom:0;width:280px;max-width:82vw;
    display:flex;flex-direction:column;align-items:stretch;gap:8px;
    padding:64px 12px 16px;background:var(--panel);
    border-right:1px solid var(--line);z-index:95;
    transform:translateX(-100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
  }
  #toolbar.open{transform:translateX(0)}

  .btn{
    display:flex;align-items:center;gap:10px;width:100%;
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;cursor:pointer;font-size:14px;
    user-select:none;white-space:nowrap;transition:.15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.accent{border-color:#2f6fbf}
  .field{
    display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--dim);
  }
  .field input{
    flex:1;min-width:0;background:transparent;border:0;color:var(--text);
    font:inherit;outline:none;padding:2px 0;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  #maparea{position:relative;flex:1 1 auto;overflow:hidden;background:#0f1115}
  #viewport{
    position:absolute;inset:0;overflow:hidden;touch-action:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:40px 40px;
  }
  #viewport.mode-scale,#viewport.mode-poi,#viewport.mode-position,#viewport.mode-calibrate{cursor:crosshair}

  #world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
  #mapimg{display:block;width:100%;height:100%;-webkit-user-drag:none;pointer-events:none}
  #overlay{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #markers{position:absolute;left:0;top:0;pointer-events:none}

  .marker{position:absolute;width:0;height:0;transform-origin:0 0}
  .marker .pin{
    position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    width:16px;height:16px;border-radius:50%;border:3px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.65);
  }
  .marker.poi .pin{background:var(--warn)}
  .marker.me .pin{background:var(--accent);width:18px;height:18px}
  
  .marker .label{
    position:absolute;left:0;top:11px;transform:translateX(-50%);
    background:rgba(10,12,16,.82);border:1px solid rgba(255,255,255,.12);
    color:#fff;font-size:11px;line-height:1.25;padding:2px 6px;border-radius:5px;
    white-space:nowrap;text-align:center;backdrop-filter:blur(4px);
  }
  .marker .label .d{color:#8fc4ff;font-weight:600}

  #poiPanel{
    position:absolute;top:62px;right:10px;width:230px;max-height:calc(100% - 80px);
    display:flex;flex-direction:column;background:rgba(28,31,38,.92);
    border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(8px);z-index:15;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    transform:translateX(calc(100% + 20px));
    transition:transform .24s cubic-bezier(.4,0,.2,1);
  }
  #poiPanel.open{transform:translateX(0);}

  #poiPanel .panel-title{
    padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--dim);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  #poiList{overflow-y:auto;padding:4px}
  #poiList .empty{padding:10px;color:var(--dim);font-size:12.5px;text-align:center}
  .poi-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:13px}
  .poi-row .poi-name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .poi-row .poi-dist{color:#8fc4ff;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .poi-row .del{
    background:transparent;border:0;color:#7d8494;cursor:pointer;font-size:14px;
    padding:0 2px;line-height:1;border-radius:4px;
  }

  .poi-summary {
    padding: 10px 8px;
    margin-top: 4px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: bold;
    color: var(--text);
  }
  .poi-summary .dist-val {
    color: var(--warn);
    font-variant-numeric: tabular-nums;
  }

  #status{
    position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);
    background:rgba(20,22,28,.9);border:1px solid var(--line);border-radius:9px;
    padding:8px 12px;font-size:12.5px;line-height:1.45;color:#cfd5e0;
    white-space:pre-line;z-index:15;backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none;
  }

  #hint{
    position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
    align-items:center;justify-content:center;color:var(--dim);font-size:15px;
    text-align:center;padding:20px;pointer-events:none;
  }
  #hint .big{font-size:38px;opacity:.5}

  #btnScaleOk {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    padding: 14px 40px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 6px 20px rgba(61, 139, 253, 0.4);
    cursor: pointer;
    display: none;
  }
  #btnScaleOk:active {
    transform: translateX(-50%) scale(0.95);
  }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal.open { display: flex; }
  .modal-content {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .modal-title { font-size: 17px; font-weight: bold; margin-bottom: 2px; text-align: center; }
  .modal-desc { font-size: 12px; color: var(--dim); margin-bottom: 12px; text-align: center; }
  .resize-btn {
    padding: 12px 14px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); font-size: 14px; cursor: pointer; text-align: left;
    transition: 0.1s;
  }
  .resize-btn:active { background: var(--accent); border-color: var(--accent); }
  .resize-cancel {
    margin-top: 6px; padding: 12px; border-radius: 8px; background: transparent; border: 1px solid var(--line);
    color: var(--dim); font-size: 14px; cursor: pointer; text-align: center;
  }

  .modal-input {
    width: 100%; padding: 12px; border-radius: 8px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--text); font-size: 16px;
    margin-bottom: 8px; outline: none; text-align: center; font-family: inherit;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-input::-webkit-outer-spin-button,
  .modal-input::-webkit-inner-spin-button {-webkit-appearance:none;margin:0}

  #toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--ok);
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    opacity: 0;
    transition: all 0.3s;
    z-index: 300;
    pointer-events: none;
    text-align: center;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width:720px){
    #btnAddPoi{top:8px;height:42px;font-size:12px;}
    #btnPoiToggle{top:8px;right:8px;width:42px;height:42px;font-size:13px;}
    #poiPanel{width:170px;max-height:42%;top:58px;right:8px;}
    #status{bottom:8px;font-size:11.5px;padding:6px 9px;left:8px;right:8px;max-width:none}
    #menuToggle{top:8px;left:8px;width:42px;height:42px;font-size:18px}
    #toolbar{padding-top:58px}
  }
</style>
</head>
<body>
<div id="app">

  <button id="menuToggle" aria-label="Меню">☰</button>
  <button id="btnAddPoi" aria-label="Добавить КП">+КП</button>
  <button id="btnPoiToggle" aria-label="Список КП">КП</button>
  
  <div id="menuOverlay"></div>

  <div id="toolbar">
    <label class="btn accent">
      <input type="file" id="fileInput" accept="image/*" hidden>
      📁 Загрузить карту
    </label>
    <button class="btn" id="btnScale">📏 Задать масштаб</button>
    <span class="field">
      1&nbsp;м&nbsp;=
      <input id="scaleInput" type="number" step="0.01" min="0.000001" placeholder="пикселей">
      px
    </span>
    <button class="btn" id="btnPos">📍 Указать положение</button>
    <button class="btn" id="btnCalibrate">🧭 Калибровка севера</button>
    <button class="btn" id="btnGps">🛰 GPS слежение</button>
    <button class="btn" id="btnFit">⤢ Вписать</button>
    <button class="btn" id="btnFull">⛶ Полный экран</button>
    <div style="height:1px;background:var(--line);margin:6px 0;"></div>
    <button class="btn" id="btnReset" style="color:#ff8a8a;border-color:#5a2e2e;">🗑 Сброс</button>
  </div>

  <div id="maparea">
    <div id="viewport">
      <div id="world">
        <img id="mapimg" alt="Карта">
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="markers"></div>
      </div>
    </div>

    <div id="hint">
      <div class="big">🗺️</div>
      <div>Загрузите изображение карты (север — вверху)</div>
    </div>

    <div id="poiPanel">
      <div class="panel-title">КП</div>
      <div id="poiList"><div class="empty">КП пока нет</div></div>
    </div>

    <div id="status">Шаг 1 — загрузите карту.</div>
  </div>
</div>

<button id="btnScaleOk">ОК</button>
<div id="toast"></div>

<div id="resizeModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">Размер изображения</div>
    <div class="modal-desc">Меньше пикселей — плавнее зум и меньше памяти.</div>
    <button class="resize-btn" data-size="1536">1536 px (макс. скорость)</button>
    <button class="resize-btn" data-size="2048">2048 px (рекомендуется)</button>
    <button class="resize-btn" data-size="2560">2560 px</button>
    <button class="resize-btn" data-size="3072">3072 px</button>
    <button class="resize-btn" data-size="4096">4096 px (высокая детализация)</button>
    <button class="resize-btn" data-size="0" style="color:var(--warn)">Оригинал (может тормозить)</button>
    <button class="resize-cancel" id="resizeCancel">Отмена</button>
  </div>
</div>

<div id="scaleModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">Задать масштаб</div>
    <div class="modal-desc" id="scaleModalDesc"></div>
    <input id="scaleMetersInput" type="number" step="any" min="0.001" placeholder="Метры" class="modal-input">
    <button class="resize-btn" id="scaleConfirmBtn" style="text-align:center; background:var(--accent); border-color:var(--accent); font-weight:bold;">Применить</button>
    <button class="resize-cancel" id="scaleCancelBtn">Отмена</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const M_PER_DEG_LAT = 111132.92;
  const LS_KEY = 'mapapp_state';
  const IDB_NAME = 'mapapp';
  const IDB_STORE = 'images';
  const JPEG_QUALITY = 0.85;

  const state = {
    imgW: 0, imgH: 0,
    scale: null,
    ref: null,
    pois: [],
    myPos: null,
    myPx: null,
    pendingGPS: null,
    northAngle: 0,
  };

  let view = { x: 0, y: 0, k: 1 };
  let mode = 'idle';
  let scalePts = [];
  let pendingScalePxLen = 0;
  let watchId = null;
  let touchState = null;
  let pinchState = null;
  let pendingFile = null;
  let draggingScalePt = -1;

  const $ = id => document.getElementById(id);
  const viewport  = $('viewport');
  const world     = $('world');
  const mapimg    = $('mapimg');
  const overlay   = $('overlay');
  const markersEl = $('markers');
  const statusEl  = $('status');
  const poiListEl = $('poiList');
  const hintEl    = $('hint');
  const scaleInput= $('scaleInput');
  const btnScale  = $('btnScale');
  const btnPos    = $('btnPos');
  const btnCalibrate = $('btnCalibrate');
  const btnGps    = $('btnGps');
  const btnFit    = $('btnFit');
  const btnFull   = $('btnFull');
  const btnReset  = $('btnReset');
  const fileInput = $('fileInput');
  const menuToggle= $('menuToggle');
  const menuOverlay = $('menuOverlay');
  const toolbar   = $('toolbar');
  const resizeModal = $('resizeModal');
  const resizeCancel = $('resizeCancel');
  const resizeBtns = document.querySelectorAll('.resize-btn');
  const scaleModal = $('scaleModal');
  const scaleModalDesc = $('scaleModalDesc');
  const scaleMetersInput = $('scaleMetersInput');
  const scaleConfirmBtn = $('scaleConfirmBtn');
  const scaleCancelBtn = $('scaleCancelBtn');
  
  const btnAddPoi = $('btnAddPoi');
  const btnPoiToggle = $('btnPoiToggle');
  const poiPanel = $('poiPanel');
  const btnScaleOk = $('btnScaleOk');
  const toastEl = $('toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 3500);
  }

  function mPerDegLon(lat) { return 111320 * Math.cos(lat * Math.PI / 180); }

  function latLonToPx(lat, lon) {
    if (!state.ref || !state.scale) return null;
    const dE = (lon - state.ref.lon) * mPerDegLon(state.ref.lat);
    const dN = (lat - state.ref.lat) * M_PER_DEG_LAT;
    
    const ca = Math.cos(state.northAngle);
    const sa = Math.sin(state.northAngle);
    
    const px_dx = (dE * ca + dN * sa) / state.scale;
    const px_dy = (dE * sa - dN * ca) / state.scale;
    
    return {
      x: state.ref.px + px_dx,
      y: state.ref.py + px_dy
    };
  }

  function getMyPx() {
    if (!state.myPos || !state.ref) return null;
    if (!state.scale) return { x: state.ref.px, y: state.ref.py };
    return latLonToPx(state.myPos.lat, state.myPos.lon);
  }

  function fmtDist(m) {
    if (m < 1000) return Math.round(m) + ' м';
    return (m / 1000).toFixed(2) + ' км';
  }

  function fmtNum(v) {
    if (v >= 1)     return v.toFixed(2);
    if (v >= 0.01)  return v.toFixed(4);
    return v.toExponential(2);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function setStatus(msg) { statusEl.textContent = msg; }

  function saveState() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        scale: state.scale,
        ref: state.ref,
        pois: state.pois,
        myPos: state.myPos,
        northAngle: state.northAngle
      }));
    } catch (e) {}
  }

  function openDB() {
    return new Promise((resolve) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  async function saveImageBlob(blob) {
    const db = await openDB();
    if (!db) return false;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(blob, 'map');
        tx.oncomplete = () => { db.close(); resolve(true); };
        tx.onerror = () => { db.close(); resolve(false); };
        tx.onabort = () => { db.close(); resolve(false); };
      } catch (e) { db.close(); resolve(false); }
    });
  }

  async function loadImageBlob() {
    const db = await openDB();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const get = tx.objectStore(IDB_STORE).get('map');
        get.onsuccess = () => { db.close(); resolve(get.result || null); };
        get.onerror = () => { db.close(); resolve(null); };
      } catch (e) { db.close(); resolve(null); }
    });
  }

  async function clearStorage() {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    await new Promise((resolve) => {
      const req = indexedDB.deleteDatabase(IDB_NAME);
      req.onsuccess = () => resolve();
      req.onerror = () => resolve();
      req.onblocked = () => resolve();
    });
  }

  async function downscaleBlob(blob, maxDim = 2048) {
    try {
      const bitmap = await createImageBitmap(blob, { imageOrientation: 'from-image' });
      const w0 = bitmap.width, h0 = bitmap.height;
      
      if (Math.max(w0, h0) <= maxDim) {
        bitmap.close();
        return { blob, width: w0, height: h0, resized: false };
      }
      
      const s = maxDim / Math.max(w0, h0);
      const w = Math.max(1, Math.round(w0 * s));
      const h = Math.max(1, Math.round(h0 * s));
      
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      
      ctx.drawImage(bitmap, 0, 0, w, h);
      bitmap.close();
      
      return new Promise((resolve) => {
        canvas.toBlob(b => {
          if (!b) resolve({ blob, width: w0, height: h0, resized: false });
          else resolve({ blob: b, width: w, height: h, resized: true });
        }, 'image/jpeg', JPEG_QUALITY);
      });
    } catch (err) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const w0 = img.naturalWidth, h0 = img.naturalHeight;
          if (Math.max(w0, h0) <= maxDim) {
            resolve({ blob, width: w0, height: h0, resized: false });
            return;
          }
          const s = maxDim / Math.max(w0, h0);
          const w = Math.max(1, Math.round(w0 * s));
          const h = Math.max(1, Math.round(h0 * s));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(b => {
            if (!b) resolve({ blob, width: w0, height: h0, resized: false });
            else resolve({ blob: b, width: w, height: h, resized: true });
          }, 'image/jpeg', JPEG_QUALITY);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
        img.src = url;
      });
    }
  }

  function openMenu() {
    toolbar.classList.add('open');
    menuOverlay.classList.add('open');
    poiPanel.classList.remove('open');
  }
  function closeMenu() {
    toolbar.classList.remove('open');
    menuOverlay.classList.remove('open');
  }
  menuToggle.addEventListener('click', () => {
    if (toolbar.classList.contains('open')) closeMenu();
    else openMenu();
  });
  menuOverlay.addEventListener('click', closeMenu);

  btnPoiToggle.addEventListener('click', () => {
    closeMenu();
    poiPanel.classList.toggle('open');
  });

  function applyView() {
    world.style.transform = `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.k})`;
    const s = 1 / view.k;
    const els = markersEl.children;
    for (let i = 0; i < els.length; i++) els[i].style.transform = `scale(${s})`;
  }

  function fitView() {
    if (!state.imgW) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const k = Math.min(vw / state.imgW, vh / state.imgH) * 0.96;
    view.k = k;
    view.x = (vw - state.imgW * k) / 2;
    view.y = (vh - state.imgH * k) / 2;
    applyView();
  }

  function centerOnMy() {
    if (!state.myPx) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    view.x = vw / 2 - state.myPx.x * view.k;
    view.y = vh / 2 - state.myPx.y * view.k;
    applyView();
  }

  function screenToImage(clientX, clientY) {
    const r = viewport.getBoundingClientRect();
    return {
      x: (clientX - r.left - view.x) / view.k,
      y: (clientY - r.top  - view.y) / view.k
    };
  }

  viewport.addEventListener('touchstart', e => {
    e.preventDefault();
    
    if (mode === 'scale' && scalePts.length === 2 && e.touches.length === 1) {
      const r = viewport.getBoundingClientRect();
      const tx = e.touches[0].clientX - r.left;
      const ty = e.touches[0].clientY - r.top;
      
      for (let i = 0; i < 2; i++) {
        const px = scalePts[i].x * view.k + view.x;
        const py = scalePts[i].y * view.k + view.y;
        if (Math.hypot(tx - px, ty - py) < 40) {
          draggingScalePt = i;
          touchState = null;
          return;
        }
      }
    }

    if (e.touches.length === 2) {
      const p1 = e.touches[0], p2 = e.touches[1];
      const r = viewport.getBoundingClientRect();
      const mid = {
        x: (p1.clientX + p2.clientX) / 2 - r.left,
        y: (p1.clientY + p2.clientY) / 2 - r.top
      };
      pinchState = {
        startDist: Math.hypot(p2.clientX - p1.clientX, p2.clientY - p1.clientY),
        startK: view.k,
        imageMid: {
          x: (mid.x - view.x) / view.k,
          y: (mid.y - view.y) / view.k
        }
      };
      touchState = null;
    } else if (e.touches.length === 1) {
      touchState = {
        startX: e.touches[0].clientX,
        startY: e.touches[0].clientY,
        startVx: view.x,
        startVy: view.y,
        moved: false
      };
    }
  }, { passive: false });

  viewport.addEventListener('touchmove', e => {
    e.preventDefault();
    
    if (draggingScalePt !== -1 && e.touches.length === 1) {
      const p = screenToImage(e.touches[0].clientX, e.touches[0].clientY);
      scalePts[draggingScalePt] = p;
      renderOverlay();
      return;
    }

    if (pinchState && e.touches.length === 2) {
      const p1 = e.touches[0], p2 = e.touches[1];
      const dist = Math.hypot(p2.clientX - p1.clientX, p2.clientY - p1.clientY);
      const k2 = Math.min(40, Math.max(0.02, pinchState.startK * (dist / pinchState.startDist)));
      const r = viewport.getBoundingClientRect();
      const mid = {
        x: (p1.clientX + p2.clientX) / 2 - r.left,
        y: (p1.clientY + p2.clientY) / 2 - r.top
      };
      view.k = k2;
      view.x = mid.x - pinchState.imageMid.x * k2;
      view.y = mid.y - pinchState.imageMid.y * k2;
      applyView();
      return;
    }
    if (touchState && e.touches.length === 1) {
      const dx = e.touches[0].clientX - touchState.startX;
      const dy = e.touches[0].clientY - touchState.startY;
      if (!touchState.moved && Math.hypot(dx, dy) > 10) touchState.moved = true;
      if (touchState.moved) {
        view.x = touchState.startVx + dx;
        view.y = touchState.startVy + dy;
        applyView();
      }
    }
  }, { passive: false });

  viewport.addEventListener('touchend', e => {
    e.preventDefault();
    
    if (draggingScalePt !== -1) {
      draggingScalePt = -1;
      return;
    }

    if (pinchState) {
      if (e.touches.length === 1) {
        const t = e.touches[0];
        touchState = { startX: t.clientX, startY: t.clientY, startVx: view.x, startVy: view.y, moved: true };
        pinchState = null;
      } else if (e.touches.length === 0) {
        pinchState = null;
        touchState = null;
      }
      return;
    }
    if (!touchState) return;
    const wasMoved = touchState.moved;
    const t = e.changedTouches[0];
    touchState = null;
    if (wasMoved) return;
    const p = screenToImage(t.clientX, t.clientY);
    if (p.x < 0 || p.y < 0 || p.x > state.imgW || p.y > state.imgH) return;
    onMapClick(p);
  }, { passive: false });

  viewport.addEventListener('touchcancel', e => {
    e.preventDefault();
    draggingScalePt = -1;
    pinchState = null;
    touchState = null;
  }, { passive: false });

  viewport.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', applyView);

  function onMapClick(p) {

    if (mode === 'scale') {
      if (scalePts.length >= 2) return;
      
      scalePts.push(p);
      renderOverlay();
      
      if (scalePts.length === 1) {
        setStatus('Масштаб: тапните 2-ю точку известного отрезка.');
      } else if (scalePts.length === 2) {
        setStatus('Отрезок задан. Двигайте точки пальцем для точности или нажмите ОК.');
        btnScaleOk.style.display = 'block';
      }
      return;
    }

    if (mode === 'position') {
      if (!state.pendingGPS) { mode = 'idle'; setModeUI(); setStatus('Нет данных GPS.'); return; }
      state.ref = {
        lat: state.pendingGPS.lat,
        lon: state.pendingGPS.lon,
        px: p.x, py: p.y
      };
      state.myPos = {
        lat: state.pendingGPS.lat,
        lon: state.pendingGPS.lon,
        acc: state.pendingGPS.acc
      };
      state.pendingGPS = null;
      mode = 'idle'; setModeUI(); render();
      
      setStatus('Положение зафиксировано. Запуск GPS-слежения…\n' +
                (state.scale ? '' : 'Не забудьте задать масштаб.'));
      if (watchId === null) {
        startGpsWatch();
      }
      return;
    }

    if (mode === 'calibrate') {
      if (!state.pendingGPS) { mode = 'idle'; setModeUI(); setStatus('Нет данных GPS.'); return; }
      
      const dE = (state.pendingGPS.lon - state.ref.lon) * mPerDegLon(state.ref.lat);
      const dN = (state.pendingGPS.lat - state.ref.lat) * M_PER_DEG_LAT;
      
      const dx = p.x - state.ref.px;
      const dy = p.y - state.ref.py;
      
      const alpha = Math.atan2(dy, dx) - Math.atan2(-dN, dE);
      
      let normAlpha = alpha;
      while (normAlpha > Math.PI) normAlpha -= 2 * Math.PI;
      while (normAlpha < -Math.PI) normAlpha += 2 * Math.PI;
      
      state.northAngle = normAlpha;
      state.myPos = {
        lat: state.pendingGPS.lat,
        lon: state.pendingGPS.lon,
        acc: state.pendingGPS.acc
      };
      state.pendingGPS = null;
      mode = 'idle'; setModeUI(); render();
      
      const deg = Math.round(state.northAngle * 180 / Math.PI);
      setStatus(`Север откалиброван. Угол поворота: ${deg}°.\nВсе расстояния теперь учитывают ориентацию карты.`);
      showToast(`🧭 Север откалиброван (${deg}°)`);
      
      if (watchId === null) {
        startGpsWatch();
      }
      return;
    }

    if (mode === 'poi') {
      let maxNum = 0;
      for (const poi of state.pois) {
        const match = poi.name.match(/КП(\d+)/);
        if (match) {
          maxNum = Math.max(maxNum, parseInt(match[1], 10));
        }
      }
      const nextName = 'КП' + (maxNum + 1);
      
      state.pois.push({
        id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7),
        name: nextName,
        x: p.x, y: p.y
      });
      mode = 'idle'; setModeUI(); render();
      setStatus('Добавлен ' + nextName);
      return;
    }
  }

  function render() {
    state.myPx = getMyPx();
    renderMarkers();
    renderOverlay();
    renderPoiList();
    syncScaleInput();
    applyView();
    saveState();
  }

  function makeMarker(x, y, cls, html) {
    const el = document.createElement('div');
    el.className = 'marker ' + cls;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.innerHTML = html;
    return el;
  }

  function renderMarkers() {
    markersEl.innerHTML = '';
    if (state.myPx) {
      const html = '<div class="pin"></div><div class="label">Я</div>';
      markersEl.appendChild(makeMarker(state.myPx.x, state.myPx.y, 'me', html));
    }
    for (const poi of state.pois) {
      const d = poiDistance(poi);
      const html =
        '<div class="pin"></div>' +
        '<div class="label">' + esc(poi.name) +
        (d != null ? '<br><span class="d">' + fmtDist(d) + '</span>' : '') +
        '</div>';
      markersEl.appendChild(makeMarker(poi.x, poi.y, 'poi', html));
    }
  }

  function poiDistance(poi) {
    if (!state.scale || !state.myPx) return null;
    return Math.hypot(poi.x - state.myPx.x, poi.y - state.myPx.y) * state.scale;
  }

  function getTotalRouteDistance() {
    if (!state.myPx || !state.scale) return null;
    if (state.pois.length === 0) return 0;
    let totalPxDist = 0;
    let prevPoint = { x: state.myPx.x, y: state.myPx.y };
    for (const poi of state.pois) {
      totalPxDist += Math.hypot(poi.x - prevPoint.x, poi.y - prevPoint.y);
      prevPoint = { x: poi.x, y: poi.y };
    }
    return totalPxDist * state.scale;
  }

  function renderOverlay() {
    overlay.innerHTML = '';
    if (state.myPx && state.myPos && state.myPos.acc && state.scale) {
      const r = state.myPos.acc / state.scale;
      if (r > 1 && r < 1e7) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', state.myPx.x);
        c.setAttribute('cy', state.myPx.y);
        c.setAttribute('r', r);
        c.setAttribute('fill', 'rgba(61,139,253,0.10)');
        c.setAttribute('stroke', 'rgba(61,139,253,0.55)');
        c.setAttribute('stroke-width', '1.5');
        c.setAttribute('vector-effect', 'non-scaling-stroke');
        overlay.appendChild(c);
      }
    }
    if (scalePts.length) {
      for (const p of scalePts) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
        c.setAttribute('r', 8);
        c.setAttribute('fill', '#ffb020');
        c.setAttribute('stroke', '#fff');
        c.setAttribute('stroke-width', '2');
        c.setAttribute('vector-effect', 'non-scaling-stroke');
        overlay.appendChild(c);
      }
      if (scalePts.length === 2) {
        const [a, b] = scalePts;
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);
        ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
        ln.setAttribute('stroke', '#ffb020');
        ln.setAttribute('stroke-width', '2');
        ln.setAttribute('stroke-dasharray', '8 6');
        ln.setAttribute('vector-effect', 'non-scaling-stroke');
        overlay.appendChild(ln);
      }
    }
  }

  function renderPoiList() {
    if (!state.pois.length) {
      poiListEl.innerHTML = '<div class="empty">КП пока нет</div>';
      return;
    }
    
    let html = state.pois.map(poi => {
      const d = poiDistance(poi);
      return '<div class="poi-row">' +
        '<span class="poi-name" title="' + esc(poi.name) + '">' + esc(poi.name) + '</span>' +
        '<span class="poi-dist">' + (d != null ? fmtDist(d) : '—') + '</span>' +
        '<button class="del" data-id="' + poi.id + '" title="Удалить">✕</button>' +
        '</div>';
    }).join('');
    
    const totalDist = getTotalRouteDistance();
    if (totalDist !== null) {
      html += '<div class="poi-summary">' +
        '<span>Общий путь:</span>' +
        '<span class="dist-val">' + fmtDist(totalDist) + '</span>' +
        '</div>';
    }
    
    poiListEl.innerHTML = html;
  }

  poiListEl.addEventListener('click', e => {
    const btn = e.target.closest('.del');
    if (!btn) return;
    const id = btn.dataset.id;
    state.pois = state.pois.filter(p => p.id !== id);
    render();
  });

  function syncScaleInput() {
    if (document.activeElement === scaleInput) return;
    scaleInput.value = state.scale ? +(1 / state.scale).toFixed(4) : '';
  }

  scaleInput.addEventListener('change', () => {
    const v = parseFloat(String(scaleInput.value).replace(',', '.'));
    if (isFinite(v) && v > 0) {
      state.scale = 1 / v;
      render();
      setStatus(`Масштаб: 1 м = ${v} px (1 px = ${fmtNum(state.scale)} м)`);
    } else {
      syncScaleInput();
    }
  });

  function setMode(m) {
    mode = m;
    viewport.classList.remove('mode-scale', 'mode-position', 'mode-poi', 'mode-calibrate');
    if (m !== 'idle') viewport.classList.add('mode-' + m);
    btnScale.classList.toggle('active', m === 'scale');
    btnPos.classList.toggle('active', m === 'position');
    btnAddPoi.classList.toggle('active', m === 'poi');
    btnCalibrate.classList.toggle('active', m === 'calibrate');
    if (m !== 'scale') {
      btnScaleOk.style.display = 'none';
    }
  }
  function setModeUI() { setMode(mode); }

  function loadMapFromUrl(url) {
    return new Promise((resolve) => {
      mapimg.onload = () => {
        state.imgW = mapimg.naturalWidth;
        state.imgH = mapimg.naturalHeight;
        world.style.width  = state.imgW + 'px';
        world.style.height = state.imgH + 'px';
        overlay.setAttribute('width', state.imgW);
        overlay.setAttribute('height', state.imgH);
        overlay.setAttribute('viewBox', `0 0 ${state.imgW} ${state.imgH}`);
        markersEl.style.width  = state.imgW + 'px';
        markersEl.style.height = state.imgH + 'px';
        hintEl.style.display = 'none';
        fitView();
        mapimg.onload = null;
        mapimg.onerror = null;
        resolve(true);
      };
      mapimg.onerror = () => {
        mapimg.onload = null;
        mapimg.onerror = null;
        resolve(false);
      };
      mapimg.src = url;
    });
  }

  fileInput.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    fileInput.value = '';
    closeMenu();
    pendingFile = file;
    resizeModal.classList.add('open');
  });

  resizeCancel.addEventListener('click', () => {
    pendingFile = null;
    resizeModal.classList.remove('open');
  });

  resizeBtns.forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!pendingFile) return;
      const maxDim = parseInt(btn.dataset.size, 10);
      const file = pendingFile;
      pendingFile = null;
      resizeModal.classList.remove('open');

      state.scale = null;
      state.ref = null;
      state.pois = [];
      state.myPos = null;
      state.myPx = null;
      state.pendingGPS = null;
      state.northAngle = 0;
      scalePts = [];
      setMode('idle');

      setStatus('Обработка изображения…');

      let finalBlob = file;
      let wasResized = false;
      try {
        if (maxDim > 0) {
          const dr = await downscaleBlob(file, maxDim);
          finalBlob = dr.blob;
          wasResized = dr.resized;
        }
      } catch (err) {
        setStatus('Не удалось прочитать изображение.');
        return;
      }

      const okSave = await saveImageBlob(finalBlob);
      const url = URL.createObjectURL(finalBlob);
      const ok = await loadMapFromUrl(url);

      if (!ok) {
        setStatus('Не удалось загрузить изображение.');
        return;
      }

      render();
      setStatus(
        `Карта загружена: ${state.imgW}×${state.imgH} px` +
        (wasResized ? ` (сжато до ${maxDim}px)` : '') + '.' +
        (okSave ? '' : '\n(Внимание: карта не сохранена в память устройства.)') +
        '\nЗадайте масштаб (📏) — тапните две точки и введите расстояние.'
      );
    });
  });

  btnScaleOk.addEventListener('click', () => {
    if (scalePts.length === 2) {
      const [a, b] = scalePts;
      const pxLen = Math.hypot(b.x - a.x, b.y - a.y);
      if (pxLen < 1) {
        setStatus('Точки слишком близко, попробуйте снова.');
        return;
      }
      pendingScalePxLen = pxLen;
      scaleModalDesc.textContent = `Длина отрезка: ${pxLen.toFixed(1)} px. Введите реальное расстояние (в метрах):`;
      scaleMetersInput.value = '';
      scaleMetersInput.style.borderColor = 'var(--line)';
      scaleModal.classList.add('open');
      setTimeout(() => scaleMetersInput.focus(), 100);
      btnScaleOk.style.display = 'none';
    }
  });

  scaleCancelBtn.addEventListener('click', () => {
    scaleModal.classList.remove('open');
    scalePts = [];
    renderOverlay();
    setMode('idle');
    setStatus('Масштаб не изменён.');
  });

  scaleConfirmBtn.addEventListener('click', applyScaleInput);
  scaleMetersInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') applyScaleInput();
  });

  function applyScaleInput() {
    const v = parseFloat(String(scaleMetersInput.value).replace(',', '.'));
    if (isFinite(v) && v > 0) {
      state.scale = v / pendingScalePxLen;
      setStatus(`Масштаб задан: 1 м = ${(1 / state.scale).toFixed(2)} px (1 px = ${fmtNum(state.scale)} м)`);
      scaleModal.classList.remove('open');
      scalePts = [];
      setMode('idle');
      render();
    } else {
      scaleMetersInput.style.borderColor = 'red';
      setTimeout(() => scaleMetersInput.style.borderColor = 'var(--line)', 1000);
    }
  }

  btnScale.addEventListener('click', () => {
    if (!state.imgW) { setStatus('Сначала загрузите карту.'); return; }
    if (mode === 'scale') { setMode('idle'); scalePts = []; renderOverlay(); setStatus('Отменено.'); return; }
    setMode('scale');
    scalePts = [];
    renderOverlay();
    setStatus('Масштаб: тапните 1-ю точку известного отрезка на карте.');
    closeMenu();
  });

  function startPositioning() {
    if (!state.imgW) { setStatus('Сначала загрузите карту.'); return; }
    if (!navigator.geolocation) { setStatus('Геолокация не поддерживается браузером.'); return; }
    setMode('idle');
    setStatus('Определяем GPS…');
    navigator.geolocation.getCurrentPosition(pos => {
      state.pendingGPS = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        acc: pos.coords.accuracy
      };
      setMode('position');
      setStatus(
        `GPS получен: ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)} ` +
        `(±${Math.round(pos.coords.accuracy)} м).\n` +
        'Тапните на карте точку, где вы сейчас находитесь.');
    }, err => {
      setMode('idle');
      let msg = 'Ошибка GPS: ' + err.message;
      if (err.code === 1) msg = 'Доступ к геолокации запрещён. Разрешите его в настройках браузера и перезагрузите страницу.';
      if (err.code === 2) msg = 'GPS недоступен. Проверьте, включена ли геолокация.';
      if (err.code === 3) msg = 'Таймаут GPS. Попробуйте ещё раз.';
      setStatus(msg);
    }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  }

  btnPos.addEventListener('click', () => { startPositioning(); closeMenu(); });

  btnCalibrate.addEventListener('click', () => {
    if (!state.imgW) { setStatus('Сначала загрузите карту.'); return; }
    if (!state.scale) { setStatus('Сначала задайте масштаб (📏).'); return; }
    if (!state.ref) { setStatus('Сначала укажите ваше положение (📍).'); return; }
    if (!navigator.geolocation) { setStatus('Геолокация не поддерживается.'); return; }
    
    setMode('idle');
    setStatus('Определяем GPS…');
    
    navigator.geolocation.getCurrentPosition(pos => {
      state.pendingGPS = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        acc: pos.coords.accuracy
      };
      
      const dE = (state.pendingGPS.lon - state.ref.lon) * mPerDegLon(state.ref.lat);
      const dN = (state.pendingGPS.lat - state.ref.lat) * M_PER_DEG_LAT;
      const dist = Math.hypot(dE, dN);
      
      if (dist < 15) {
        setStatus(`Вы прошли всего ${Math.round(dist)} м. Для точной калибровки пройдите хотя бы 30-50 метров и попробуйте снова.`);
        return;
      }
      
      setMode('calibrate');
      setStatus(
        `GPS: ${state.pendingGPS.lat.toFixed(6)}, ${state.pendingGPS.lon.toFixed(6)} (±${Math.round(state.pendingGPS.acc)} м).\n` +
        `Вы отошли на ${Math.round(dist)} м. Тапните на карте, где вы сейчас находитесь.`
      );
    }, err => {
      setMode('idle');
      setStatus('Ошибка GPS: ' + err.message);
    }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
    
    closeMenu();
  });

  function startGpsWatch() {
    if (!state.ref) return;
    if (!navigator.geolocation) { setStatus('Геолокация не поддерживается.'); return; }
    if (watchId !== null) return;

    btnGps.classList.add('active');
    setStatus('Запуск GPS-слежения…');
    watchId = navigator.geolocation.watchPosition(onGpsUpdate, onGpsError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 30000
    });
  }

  function stopGpsWatch() {
    if (watchId !== null) {
      try { navigator.geolocation.clearWatch(watchId); } catch (e) {}
      watchId = null;
      btnGps.classList.remove('active');
      setStatus('GPS-слежение остановлено.');
    }
  }

  btnGps.addEventListener('click', () => {
    if (watchId !== null) {
      stopGpsWatch();
    } else {
      if (!state.ref) {
        setStatus('Сначала нажмите «📍 Указать положение» и отметьте себя на карте.');
        return;
      }
      startGpsWatch();
    }
    closeMenu();
  });

  function onGpsUpdate(pos) {
    state.myPos = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      acc: pos.coords.accuracy
    };
    render();
    setStatus(
      `GPS: ${state.myPos.lat.toFixed(6)}, ${state.myPos.lon.toFixed(6)}  ±${Math.round(state.myPos.acc)} м` +
      (state.scale ? '' : '\n(масштаб не задан — расстояния не считаются)'));
  }

  function onGpsError(err) {
    setStatus('Ошибка GPS: ' + err.message);
  }

  btnAddPoi.addEventListener('click', () => {
    if (!state.imgW) { setStatus('Сначала загрузите карту.'); return; }
    if (mode === 'poi') { setMode('idle'); setStatus('Отменено.'); return; }
    setMode('poi');
    setStatus('Тапните на карте место для нового КП.');
    closeMenu();
  });

  btnFit.addEventListener('click', () => {
    if (!state.imgW) return;
    fitView();
    closeMenu();
  });

  btnFull.addEventListener('click', () => {
    const el = document.documentElement;
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) req.call(el);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (exit) exit.call(document);
    }
    closeMenu();
  });

  btnReset.addEventListener('click', async () => {
    if (!confirm('Удалить карту, масштаб, положение и все КП?')) return;
    stopGpsWatch();
    await clearStorage();
    state.imgW = 0; state.imgH = 0;
    state.scale = null;
    state.ref = null;
    state.pois = [];
    state.myPos = null;
    state.myPx = null;
    state.pendingGPS = null;
    state.northAngle = 0;
    scalePts = [];
    setMode('idle');
    view = { x: 0, y: 0, k: 1 };
    applyView();
    mapimg.onload = null;
    mapimg.onerror = null;
    mapimg.removeAttribute('src');
    world.style.width = '0';
    world.style.height = '0';
    overlay.innerHTML = '';
    markersEl.innerHTML = '';
    poiListEl.innerHTML = '<div class="empty">КП пока нет</div>';
    scaleInput.value = '';
    hintEl.style.display = '';
    setStatus('Всё удалено. Нажмите «Загрузить карту».');
  });

  async function init() {
    try {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) {
        const s = JSON.parse(saved);
        if (s.scale != null && s.scale > 0) state.scale = s.scale;
        if (s.ref && typeof s.ref === 'object') state.ref = s.ref;
        if (Array.isArray(s.pois)) state.pois = s.pois;
        if (s.myPos && typeof s.myPos === 'object') state.myPos = s.myPos;
        if (s.northAngle != null) state.northAngle = s.northAngle;
      }
    } catch (e) {}

    let blob = null;
    try { blob = await loadImageBlob(); } catch (e) {}

    if (blob) {
      let finalBlob = blob;
      try {
        const dr = await downscaleBlob(blob, 4096);
        if (dr.resized) {
          finalBlob = dr.blob;
          await saveImageBlob(finalBlob);
        }
      } catch (e) {}

      const url = URL.createObjectURL(finalBlob);
      const ok = await loadMapFromUrl(url);
      if (ok) {
        render();
        setStatus(state.ref
          ? 'Карта восстановлена. Ваше положение и КП на месте.'
          : 'Карта восстановлена. Задайте масштаб (📏) и укажите положение (📍).');
        return;
      }
      state.scale = null;
      state.ref = null;
      state.pois = [];
      state.myPos = null;
      state.northAngle = 0;
    }

    render();
    setStatus('Шаг 1 — загрузите карту.');
  }

  init();
})();
</script>
</body>
</html>
